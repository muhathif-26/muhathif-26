<svg width="850" height="410" viewBox="0 0 850 410" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for progress bars -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="70%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1220" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="850" height="410" rx="14" fill="url(#bgGradient)" stroke="#182a44" stroke-width="1.5"/>

  <!-- Card Header / Terminal Dots -->
  <rect x="0" y="0" width="850" height="42" rx="14" fill="#111827" />
  <rect x="0" y="28" width="850" height="14" fill="#111827" />
  <line x1="0" y1="42" x2="850" y2="42" stroke="#182a44" stroke-width="1" />

  <circle cx="24" cy="21" r="5.5" fill="#ff5f56" />
  <circle cx="42" cy="21" r="5.5" fill="#ffbd2e" />
  <circle cx="60" cy="21" r="5.5" fill="#27c93f" />

  <text x="425" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#5b6b84" letter-spacing="1">SKILLS &amp; PROFICIENCY DASHBOARD</text>

  <!-- Left Column -->
  <!-- 1. Python (85%) -->
  <g transform="translate(40, 65)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Python</text>
    <text x="350" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D9FF">85%</text>
    <rect x="0" y="26" width="350" height="10" rx="5" fill="#141c2b" stroke="#1f2d42" stroke-width="1"/>
    <rect x="0" y="26" width="297.5" height="10" rx="5" fill="url(#cyanGradient)"/>
    <circle cx="297.5" cy="31" r="4" fill="#00D9FF" filter="url(#glow)"/>
  </g>

  <!-- 2. JavaScript (85%) -->
  <g transform="translate(40, 130)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">JavaScript</text>
    <text x="350" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D9FF">85%</text>
    <rect x="0" y="26" width="350" height="10" rx="5" fill="#141c2b" stroke="#1f2d42" stroke-width="1"/>
    <rect x="0" y="26" width="297.5" height="10" rx="5" fill="url(#cyanGradient)"/>
    <circle cx="297.5" cy="31" r="4" fill="#00D9FF" filter="url(#glow)"/>
  </g>

  <!-- 3. React (80%) -->
  <g transform="translate(40, 195)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">React</text>
    <text x="350" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D9FF">80%</text>
    <rect x="0" y="26" width="350" height="10" rx="5" fill="#141c2b" stroke="#1f2d42" stroke-width="1"/>
    <rect x="0" y="26" width="280" height="10" rx="5" fill="url(#cyanGradient)"/>
    <circle cx="280" cy="31" r="4" fill="#00D9FF" filter="url(#glow)"/>
  </g>

  <!-- 4. Node.js (78%) -->
  <g transform="translate(40, 260)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Node.js</text>
    <text x="350" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D9FF">78%</text>
    <rect x="0" y="26" width="350" height="10" rx="5" fill="#141c2b" stroke="#1f2d42" stroke-width="1"/>
    <rect x="0" y="26" width="273" height="10" rx="5" fill="url(#cyanGradient)"/>
    <circle cx="273" cy="31" r="4" fill="#00D9FF" filter="url(#glow)"/>
  </g>

  <!-- 5. Java (75%) -->
  <g transform="translate(40, 325)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Java</text>
    <text x="350" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D9FF">75%</text>
    <rect x="0" y="26" width="350" height="10" rx="5" fill="#141c2b" stroke="#1f2d42" stroke-width="1"/>
    <rect x="0" y="26" width="262.5" height="10" rx="5" fill="url(#cyanGradient)"/>
    <circle cx="262.5" cy="31" r="4" fill="#00D9FF" filter="url(#glow)"/>
  </g>

  <!-- Right Column -->
  <!-- 6. SQL (70%) -->
  <g transform="translate(460, 65)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">SQL</text>
    <text x="350" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D9FF">70%</text>
    <rect x="0" y="26" width="350" height="10" rx="5" fill="#141c2b" stroke="#1f2d42" stroke-width="1"/>
    <rect x="0" y="26" width="245" height="10" rx="5" fill="url(#cyanGradient)"/>
    <circle cx="245" cy="31" r="4" fill="#00D9FF" filter="url(#glow)"/>
  </g>

  <!-- 7. PHP (60%) -->
  <g transform="translate(460, 130)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">PHP</text>
    <text x="350" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D9FF">60%</text>
    <rect x="0" y="26" width="350" height="10" rx="5" fill="#141c2b" stroke="#1f2d42" stroke-width="1"/>
    <rect x="0" y="26" width="210" height="10" rx="5" fill="url(#cyanGradient)"/>
    <circle cx="210" cy="31" r="4" fill="#00D9FF" filter="url(#glow)"/>
  </g>

  <!-- 8. Docker (55%) -->
  <g transform="translate(460, 195)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Docker</text>
    <text x="350" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D9FF">55%</text>
    <rect x="0" y="26" width="350" height="10" rx="5" fill="#141c2b" stroke="#1f2d42" stroke-width="1"/>
    <rect x="0" y="26" width="192.5" height="10" rx="5" fill="url(#cyanGradient)"/>
    <circle cx="192.5" cy="31" r="4" fill="#00D9FF" filter="url(#glow)"/>
  </g>

  <!-- 9. AWS (50%) -->
  <g transform="translate(460, 260)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">AWS</text>
    <text x="350" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D9FF">50%</text>
    <rect x="0" y="26" width="350" height="10" rx="5" fill="#141c2b" stroke="#1f2d42" stroke-width="1"/>
    <rect x="0" y="26" width="175" height="10" rx="5" fill="url(#cyanGradient)"/>
    <circle cx="175" cy="31" r="4" fill="#00D9FF" filter="url(#glow)"/>
  </g>

  <!-- 10. System Design (45%) -->
  <g transform="translate(460, 325)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">System Design</text>
    <text x="350" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D9FF">45%</text>
    <rect x="0" y="26" width="350" height="10" rx="5" fill="#141c2b" stroke="#1f2d42" stroke-width="1"/>
    <rect x="0" y="26" width="157.5" height="10" rx="5" fill="url(#cyanGradient)"/>
    <circle cx="157.5" cy="31" r="4" fill="#00D9FF" filter="url(#glow)"/>
  </g>
</svg>
